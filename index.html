<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Baník Stochov — Trenér</title>
<style>
  :root{
    --black:#0a0d0b;
    --green-deep:#0f2417;
    --green:#1c4a2c;
    --green-bright:#3f9c5c;
    --white:#f3f4ef;
    --line:rgba(243,244,239,0.13);
    --muted:rgba(243,244,239,0.52);
    --card:#101613;
    --danger:#b0453d;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--black);
    color:var(--white);
    font-family:-apple-system, "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
    overscroll-behavior:none;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    background:
      radial-gradient(120% 60% at 50% -10%, var(--green-deep) 0%, var(--black) 65%);
  }

  /* ---- Header ---- */
  header{
    padding:22px 20px 16px;
    display:flex;
    align-items:center;
    gap:14px;
    border-bottom:1px solid var(--line);
  }
  .crest{flex:0 0 auto;}
  .club-name{
    font-size:20px;
    font-weight:800;
    letter-spacing:-0.02em;
    line-height:1.1;
  }
  .club-sub{
    font-size:13px;
    color:var(--muted);
    margin-top:2px;
    font-weight:500;
  }

  /* ---- Main content ---- */
  main{
    flex:1;
    padding:18px 16px 100px;
    overflow-y:auto;
  }
  .section-title{
    font-size:26px;
    font-weight:800;
    letter-spacing:-0.02em;
    margin:4px 0 16px;
  }
  .empty{
    border:1px dashed var(--line);
    border-radius:14px;
    padding:26px 18px;
    text-align:center;
    color:var(--muted);
    font-size:14.5px;
    line-height:1.5;
  }

  /* ---- Cards ---- */
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:10px;
  }
  .player-card{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .jersey-num{
    flex:0 0 auto;
    width:44px;
    height:44px;
    border-radius:10px;
    background:var(--green);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    font-size:18px;
    color:var(--white);
    border:1px solid rgba(63,156,92,0.4);
  }
  .avatar-wrap{position:relative; flex:0 0 auto;}
  .player-avatar{
    width:44px;
    height:44px;
    border-radius:10px;
    object-fit:cover;
    display:block;
    border:1px solid var(--line);
  }
  .avatar-num-badge{
    position:absolute;
    bottom:-5px;
    right:-5px;
    background:var(--green);
    color:var(--white);
    font-size:10px;
    font-weight:800;
    padding:1px 5px;
    border-radius:6px;
    border:1px solid rgba(63,156,92,0.5);
  }
  .player-info{flex:1; min-width:0;}
  .player-name{font-weight:700; font-size:16px;}
  .player-meta{font-size:12.5px; color:var(--muted); margin-top:2px;}
  .rating-pill{
    flex:0 0 auto;
    font-size:13px;
    font-weight:700;
    padding:4px 9px;
    border-radius:20px;
    background:rgba(63,156,92,0.16);
    color:var(--green-bright);
    border:1px solid rgba(63,156,92,0.3);
  }

  .row-between{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .muted{color:var(--muted);}
  .small{font-size:12.5px;}

  .tag{
    display:inline-block;
    font-size:11.5px;
    font-weight:600;
    padding:2px 8px;
    border-radius:20px;
    border:1px solid var(--line);
    color:var(--muted);
  }

  .match-score{
    font-size:22px;
    font-weight:800;
    letter-spacing:-0.01em;
  }
  .match-score.pending{color:var(--muted); font-weight:600; font-size:15px;}

  .result-W{color:var(--green-bright);}
  .result-D{color:#d8c15c;}
  .result-L{color:var(--danger);}

  /* ---- Forms ---- */
  .fab{
    position:fixed;
    right:calc(50% - 240px + 18px);
    bottom:96px;
    width:54px;
    height:54px;
    border-radius:16px;
    background:var(--green-bright);
    color:var(--black);
    border:none;
    font-size:28px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 8px 20px rgba(63,156,92,0.35);
  }
  @media (max-width:480px){
    .fab{right:18px;}
  }
  .fab:active{transform:scale(0.94);}

  .sheet-backdrop{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.55);
    display:none;
    z-index:20;
    max-width:480px;
    margin:0 auto;
  }
  .sheet-backdrop.open{display:block;}
  .sheet{
    position:fixed;
    left:0; right:0; bottom:0;
    max-width:480px;
    margin:0 auto;
    background:#131a15;
    border-top:1px solid var(--line);
    border-radius:20px 20px 0 0;
    padding:18px 18px calc(24px + env(safe-area-inset-bottom));
    transform:translateY(100%);
    transition:transform 0.28s ease;
    z-index:21;
    max-height:85vh;
    overflow-y:auto;
  }
  .sheet-backdrop.open .sheet{transform:translateY(0);}
  .sheet-title{font-size:18px; font-weight:800; margin-bottom:14px;}

  label{
    display:block;
    font-size:12.5px;
    color:var(--muted);
    font-weight:600;
    margin:12px 0 6px;
  }
  input, select, textarea{
    width:100%;
    background:#0d1310;
    border:1px solid var(--line);
    color:var(--white);
    border-radius:10px;
    padding:11px 12px;
    font-size:15px;
    font-family:inherit;
  }
  textarea{resize:vertical; min-height:60px;}
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--green-bright);}

  .sheet-actions{display:flex; gap:10px; margin-top:18px;}
  .btn{
    flex:1;
    padding:13px;
    border-radius:11px;
    font-weight:700;
    font-size:15px;
    border:none;
    text-align:center;
  }
  .btn-primary{background:var(--green-bright); color:var(--black);}
  .btn-ghost{background:transparent; color:var(--muted); border:1px solid var(--line);}
  .btn-danger-text{background:none; border:none; color:var(--danger); font-size:13px; font-weight:600; padding:6px 0;}

  .photo-picker{
    display:flex; align-items:center; gap:14px; margin-top:8px;
  }
  .photo-preview{
    width:72px; height:72px; border-radius:14px; object-fit:cover;
    border:1px solid var(--line); background:#0d1310;
  }
  .photo-btns{display:flex; flex-direction:column; gap:8px;}
  .btn-small{
    padding:8px 12px; border-radius:9px; font-size:13px; font-weight:700;
    border:1px solid var(--line); background:transparent; color:var(--white);
    text-align:center; display:inline-block;
  }
  .diagram-canvas-wrap{
    margin-top:8px;
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
  }
  #exCanvas{display:block; width:100%; height:auto; touch-action:none; background:#1c4a2c;}
  .diagram-thumb{
    width:100%;
    border-radius:10px;
    margin-top:8px;
    display:block;
    border:1px solid var(--line);
  }

  .exercise-pick{
    display:flex; align-items:center; gap:10px;
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .exercise-pick:last-child{border-bottom:none;}
  .exercise-pick input[type=checkbox]{width:20px; height:20px; flex:0 0 auto;}
  .exercise-pick-name{font-weight:600; font-size:14.5px;}
  .exercise-pick-desc{font-size:12px; color:var(--muted);}

  .stat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:16px;
  }
  .stat-box{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px;
  }
  .stat-value{font-size:26px; font-weight:800; letter-spacing:-0.02em;}
  .stat-label{font-size:12px; color:var(--muted); margin-top:2px; font-weight:600;}

  /* ---- Bottom nav ---- */
  nav{
    position:fixed;
    left:0; right:0; bottom:0;
    max-width:480px;
    margin:0 auto;
    background:rgba(10,13,11,0.92);
    backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    display:flex;
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    z-index:10;
  }
  .nav-btn{
    flex:1;
    background:none;
    border:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    padding:6px 0;
    color:var(--muted);
  }
  .nav-btn svg{width:22px; height:22px;}
  .nav-btn span{font-size:10.5px; font-weight:600;}
  .nav-btn.active{color:var(--green-bright);}
  .nav-btn.active svg{stroke:var(--green-bright);}

  .hidden{display:none !important;}

  ::-webkit-scrollbar{display:none;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3/lib/msal-browser.min.js"></script>
</head>
<body>
<div id="app">

  <header>
    <div class="crest">
      <svg width="42" height="48" viewBox="0 0 42 48">
        <path d="M21 1 L40 8 V22 C40 35 32 43 21 47 C10 43 2 35 2 22 V8 Z"
          fill="#122a1a" stroke="#3f9c5c" stroke-width="1.5"/>
        <path d="M21 1 L40 8 V22 C40 35 32 43 21 47 Z" fill="#1c4a2c" opacity="0.7"/>
        <text x="21" y="29" text-anchor="middle" font-family="-apple-system, sans-serif"
          font-size="15" font-weight="800" fill="#f3f4ef">BS</text>
      </svg>
    </div>
    <div>
      <div class="club-name">Baník Stochov</div>
      <div class="club-sub">Mladší přípravka · Trenérský pomocník</div>
    </div>
    <button id="menuBtn" onclick="openBackupSheet()" aria-label="Záloha dat" style="margin-left:auto; background:none; border:none; color:var(--muted); padding:6px; flex:0 0 auto;">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>
    </button>
  </header>

  <main id="main"></main>

  <button class="fab hidden" id="fab">+</button>

  <nav>
    <button class="nav-btn active" data-tab="players">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
      <span>Hráči</span>
    </button>
    <button class="nav-btn" data-tab="trainings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3v3h6V3M8 11h8M8 15h5"/></svg>
      <span>Tréninky</span>
    </button>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7l3.5 2.6-1.3 4.1h-4.4L8.5 9.6z"/></svg>
      <span>Zápasy</span>
    </button>
    <button class="nav-btn" data-tab="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
      <span>Statistiky</span>
    </button>
  </nav>

  <div class="sheet-backdrop" id="sheetBackdrop">
    <div class="sheet" id="sheet"></div>
  </div>

</div>

<script>
const POSITIONS = ["Brankář","Obránce","Záložník","Útočník"];
const TRANSPARENT_PX = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==";

// ===== OneDrive sync config =====
// Po registraci appky v Azure Portalu sem vlož Application (client) ID:
const MSAL_CLIENT_ID = "PASTE-YOUR-AZURE-CLIENT-ID-HERE";
const GRAPH_SCOPES = ["Files.ReadWrite", "User.Read"];
let msalInstance = null;
let msalAccount = null;
let tempPlayerPhoto = null;
let diagramCtx = null;
let drawing = false;
let lastX = 0, lastY = 0;

let state = {
  players: [],
  trainings: [],
  matches: [],
  exercises: [
    {id:cryptoId(), name:"Honička s míčem", desc:"Každý s míčem, na signál honička v vymezeném území — rozvoj vedení míče."},
    {id:cryptoId(), name:"Slalom mezi kužely", desc:"Vedení míče slalomem, důraz na oba kotníky."},
    {id:cryptoId(), name:"Přihrávky ve dvojicích", desc:"Přesnost a příprava míče na první dotek."},
    {id:cryptoId(), name:"Střelba na branku", desc:"Zakončení po vedení míče z různých úhlů."},
    {id:cryptoId(), name:"Rondo 4+1", desc:"Držení míče v malé skupině, rychlá rozehrávka."},
    {id:cryptoId(), name:"Přihrávka a pohyb", desc:"Přihrát a okamžitě se uvolnit do prostoru."}
  ]
};

let currentTab = "players";

function cryptoId(){ return Math.random().toString(36).slice(2,10); }

async function loadAll(){
  for(const key of ["players","trainings","matches","exercises"]){
    try{
      const raw = localStorage.getItem("banik_"+key);
      if(raw) state[key] = JSON.parse(raw);
    }catch(e){ /* no saved data yet, keep default */ }
  }
  initMsal();
  if(getCloudConfig() && msalAccount){
    const ok = await cloudLoad();
    if(ok) writeLocalCacheOnly();
  }
  render();
}
let cloudSaveTimer = null;
function save(key){
  try{ localStorage.setItem("banik_"+key, JSON.stringify(state[key])); }
  catch(e){ console.error("Uložení se nepovedlo", e); }
  if(getCloudConfig() && msalAccount){
    clearTimeout(cloudSaveTimer);
    cloudSaveTimer = setTimeout(cloudSave, 900);
  }
}
function writeLocalCacheOnly(){
  ["players","trainings","matches","exercises"].forEach(k=>{
    localStorage.setItem("banik_"+k, JSON.stringify(state[k]));
  });
}

// ===== Microsoft sign-in (MSAL) =====
function initMsal(){
  if(!window.msal || MSAL_CLIENT_ID.startsWith("PASTE")) return;
  if(!msalInstance){
    msalInstance = new msal.PublicClientApplication({
      auth: {
        clientId: MSAL_CLIENT_ID,
        authority: "https://login.microsoftonline.com/consumers",
        redirectUri: window.location.origin + window.location.pathname
      },
      cache: { cacheLocation: "localStorage" }
    });
  }
  return msalInstance.handleRedirectPromise().then(resp=>{
    if(resp && resp.account){ msalAccount = resp.account; }
    else {
      const accounts = msalInstance.getAllAccounts();
      if(accounts.length) msalAccount = accounts[0];
    }
  }).catch(e=> console.error("Přihlášení se nepovedlo", e));
}
function signIn(){
  if(!msalInstance){ alert("Přihlášení zatím není nastavené — v appce chybí Client ID z Azure."); return; }
  msalInstance.loginRedirect({scopes: GRAPH_SCOPES});
}
function signOutMs(){
  if(!msalInstance) return;
  msalInstance.logoutRedirect();
}
async function getGraphToken(){
  if(!msalInstance || !msalAccount) return null;
  try{
    const res = await msalInstance.acquireTokenSilent({scopes:GRAPH_SCOPES, account: msalAccount});
    return res.accessToken;
  }catch(e){
    try{ await msalInstance.acquireTokenRedirect({scopes:GRAPH_SCOPES}); }catch(e2){ console.error(e2); }
    return null;
  }
}

// ===== Sdílený soubor v OneDrive =====
function getCloudConfig(){
  try{ return JSON.parse(localStorage.getItem("banik_cloud_config")||"null"); }catch(e){ return null; }
}
function setCloudConfig(cfg){ localStorage.setItem("banik_cloud_config", JSON.stringify(cfg)); }
function disconnectCloud(){ localStorage.removeItem("banik_cloud_config"); closeSheet(); render(); }

async function resolveShareLink(shareUrl){
  const token = await getGraphToken();
  if(!token) throw new Error("Nejsi přihlášený.");
  const encoded = "u!" + btoa(shareUrl).replace(/=+$/,"").replace(/\//g,"_").replace(/\+/g,"-");
  const res = await fetch(`https://graph.microsoft.com/v1.0/shares/${encoded}/driveItem`, {
    headers:{ Authorization: "Bearer "+token }
  });
  if(!res.ok) throw new Error("Odkaz na soubor se nepodařilo načíst.");
  const item = await res.json();
  return { driveId: item.parentReference.driveId, itemId: item.id };
}
async function connectShareLink(){
  const url = document.getElementById("f-shareLink").value.trim();
  if(!url) return;
  try{
    const cfg = await resolveShareLink(url);
    setCloudConfig(cfg);
    const ok = await cloudLoad();
    if(ok) writeLocalCacheOnly();
    closeSheet(); render();
  }catch(e){
    alert("Propojení se nepovedlo: " + e.message);
  }
}
async function manualCloudSync(){
  const ok = await cloudLoad();
  if(ok) writeLocalCacheOnly();
  closeSheet(); render();
}
async function cloudLoad(){
  const cfg = getCloudConfig();
  if(!cfg) return false;
  const token = await getGraphToken();
  if(!token) return false;
  try{
    const res = await fetch(`https://graph.microsoft.com/v1.0/drives/${cfg.driveId}/items/${cfg.itemId}/content`, {
      headers:{ Authorization:"Bearer "+token }
    });
    if(!res.ok) return false;
    const text = await res.text();
    if(!text.trim()) return false;
    const data = JSON.parse(text);
    ["players","trainings","matches","exercises"].forEach(key=>{
      if(Array.isArray(data[key])) state[key] = data[key];
    });
    return true;
  }catch(e){ console.error("cloudLoad", e); return false; }
}
async function cloudSave(){
  const cfg = getCloudConfig();
  if(!cfg) return;
  const token = await getGraphToken();
  if(!token) return;
  const payload = {
    players: state.players, trainings: state.trainings,
    matches: state.matches, exercises: state.exercises,
    savedAt: new Date().toISOString()
  };
  try{
    await fetch(`https://graph.microsoft.com/v1.0/drives/${cfg.driveId}/items/${cfg.itemId}/content`, {
      method:"PUT",
      headers:{ Authorization:"Bearer "+token, "Content-Type":"application/json" },
      body: JSON.stringify(payload)
    });
  }catch(e){ console.error("cloudSave", e); }
}

function openBackupSheet(){
  let cloudSectionHtml;
  if(!window.msal || MSAL_CLIENT_ID.startsWith("PASTE")){
    cloudSectionHtml = `<div class="small muted" style="margin-bottom:14px; line-height:1.5;">Synchronizace přes OneDrive ještě není nastavená (v appce chybí Client ID z Azure).</div>`;
  } else if(!msalAccount){
    cloudSectionHtml = `
      <div class="small muted" style="margin-bottom:10px; line-height:1.5;">Přihlas se Microsoft účtem, abys mohl appku propojit se sdíleným souborem v OneDrive.</div>
      <button class="btn btn-primary" style="width:100%;" onclick="signIn()">Přihlásit Microsoft účtem</button>
    `;
  } else {
    const cfg = getCloudConfig();
    if(cfg){
      cloudSectionHtml = `
        <div class="small" style="margin-bottom:10px;">Přihlášen jako <strong>${esc(msalAccount.username||"")}</strong></div>
        <button class="btn btn-primary" style="width:100%;" onclick="manualCloudSync()">Synchronizovat nyní</button>
        <div style="display:flex; gap:16px; margin-top:10px;">
          <button class="btn-danger-text" onclick="disconnectCloud()">Odpojit sdílenou složku</button>
          <button class="btn-danger-text" style="color:var(--muted);" onclick="signOutMs()">Odhlásit</button>
        </div>
      `;
    } else {
      cloudSectionHtml = `
        <div class="small" style="margin-bottom:10px;">Přihlášen jako <strong>${esc(msalAccount.username||"")}</strong></div>
        <label>Odkaz na sdílený soubor v OneDrive</label>
        <input id="f-shareLink" placeholder="Vlož odkaz na sdílení...">
        <button class="btn btn-primary" style="width:100%; margin-top:10px;" onclick="connectShareLink()">Propojit</button>
        <button class="btn-danger-text" style="margin-top:8px;" onclick="signOutMs()">Odhlásit</button>
      `;
    }
  }
  openSheet(`
    <div class="sheet-title">Záloha a sdílení dat</div>
    ${cloudSectionHtml}
    <div style="border-top:1px solid var(--line); margin:18px 0 14px;"></div>
    <div class="small muted" style="margin-bottom:10px;">Ruční záloha (funguje vždy, i bez OneDrive)</div>
    <button class="btn btn-ghost" style="width:100%;" onclick="exportData()">Exportovat zálohu</button>
    <label class="btn btn-ghost" style="width:100%; display:block; text-align:center; margin-top:10px; box-sizing:border-box;">
      Importovat zálohu
      <input type="file" accept="application/json" style="display:none;" onchange="importData(event)">
    </label>
    <div class="sheet-actions" style="margin-top:18px;">
      <button class="btn btn-ghost" style="width:100%;" onclick="closeSheet()">Zavřít</button>
    </div>
  `);
}
function exportData(){
  const payload = {
    players: state.players,
    trainings: state.trainings,
    matches: state.matches,
    exercises: state.exercises,
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "banik-stochov-zaloha-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importData(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      ["players","trainings","matches","exercises"].forEach(key=>{
        if(Array.isArray(data[key])){ state[key] = data[key]; save(key); }
      });
      closeSheet(); render();
    }catch(e){
      alert("Soubor se nepodařilo načíst — zkontroluj, že je to záloha z téhle appky.");
    }
  };
  reader.readAsText(file);
}

async function onPhotoPicked(evt){
  const file = evt.target.files[0];
  if(!file) return;
  try{
    const dataUrl = await compressImage(file, 420, 0.72);
    tempPlayerPhoto = dataUrl;
    const img = document.getElementById("photoPreview");
    img.src = dataUrl;
    img.style.opacity = "1";
  }catch(e){ console.error("Fotku se nepodařilo zpracovat", e); }
}
function removePhoto(){
  tempPlayerPhoto = null;
  const img = document.getElementById("photoPreview");
  if(img){ img.src = TRANSPARENT_PX; img.style.opacity = "0.35"; }
}
function compressImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = h*(maxDim/w); w = maxDim; }
        else if(h >= w && h > maxDim){ w = w*(maxDim/h); h = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(w); canvas.height = Math.round(h);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function drawPitchTemplate(ctx, w, h){
  ctx.fillStyle = "#1c4a2c";
  ctx.fillRect(0,0,w,h);
  ctx.strokeStyle = "rgba(243,244,239,0.55)";
  ctx.lineWidth = 2;
  ctx.strokeRect(6,6,w-12,h-12);
  ctx.beginPath();
  ctx.moveTo(w/2,6); ctx.lineTo(w/2,h-6); ctx.stroke();
  ctx.beginPath();
  ctx.arc(w/2,h/2, Math.min(w,h)*0.16, 0, Math.PI*2); ctx.stroke();
}

function initDiagramCanvas(ex){
  const canvas = document.getElementById("exCanvas");
  if(!canvas) return;
  const ctx = canvas.getContext("2d");
  diagramCtx = ctx;
  if(ex && ex.diagram){
    const img = new Image();
    img.onload = ()=> ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    img.src = ex.diagram;
  } else {
    drawPitchTemplate(ctx, canvas.width, canvas.height);
  }
  ctx.strokeStyle = "#f3f4ef";
  ctx.lineWidth = 3;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  function pos(evt){
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width/rect.width, scaleY = canvas.height/rect.height;
    return {x:(evt.clientX-rect.left)*scaleX, y:(evt.clientY-rect.top)*scaleY};
  }
  function start(evt){
    evt.preventDefault();
    drawing = true;
    const p = pos(evt); lastX=p.x; lastY=p.y;
  }
  function move(evt){
    if(!drawing) return;
    evt.preventDefault();
    const p = pos(evt);
    ctx.beginPath();
    ctx.moveTo(lastX,lastY);
    ctx.lineTo(p.x,p.y);
    ctx.stroke();
    lastX=p.x; lastY=p.y;
  }
  function end(){ drawing = false; }

  canvas.onpointerdown = start;
  canvas.onpointermove = move;
  canvas.onpointerup = end;
  canvas.onpointerleave = end;
  canvas.onpointercancel = end;
}

function clearDiagram(){
  const canvas = document.getElementById("exCanvas");
  if(!canvas || !diagramCtx) return;
  drawPitchTemplate(diagramCtx, canvas.width, canvas.height);
}

function renderMatches(main){
  const matches = [...state.matches].sort((a,b)=> new Date(b.date)-new Date(a.date));

  if(matches.length===0){
    html += `<div class="empty">Zatím žádné zápasy v rozpisu.<br>Přidej první zápas tlačítkem +.</div>`;
  } else {
    html += matches.map(m=>{
      const played = m.goalsFor!==null && m.goalsFor!=="" && m.goalsAgainst!==null && m.goalsAgainst!=="";
      let resultClass = "";
      if(played){
        const gf = Number(m.goalsFor), ga = Number(m.goalsAgainst);
        resultClass = gf>ga ? "result-W" : gf<ga ? "result-L" : "result-D";
      }
      return `
      <div class="card" onclick="openMatchSheet('${m.id}')">
        <div class="row-between">
          <div>
            <div style="font-weight:700;">${m.home ? "Baník Stochov" : esc(m.opponent)} <span class="muted">vs</span> ${m.home ? esc(m.opponent) : "Baník Stochov"}</div>
            <div class="small muted" style="margin-top:2px;">${formatDate(m.date)} · ${m.home ? "doma" : "venku"}</div>
          </div>
          <div class="match-score ${played?resultClass:'pending'}">
            ${played ? `${m.goalsFor}:${m.goalsAgainst}` : "—"}
          </div>
        </div>
      </div>`;
    }).join("");
  }
  main.innerHTML = html;
}

// ================= STATS =================
function renderStats(main){
  const played = state.matches.filter(m=> m.goalsFor!==null && m.goalsFor!=="" && m.goalsAgainst!==null && m.goalsAgainst!=="");
  let w=0,d=0,l=0,gf=0,ga=0;
  played.forEach(m=>{
    const f=Number(m.goalsFor), a=Number(m.goalsAgainst);
    gf+=f; ga+=a;
    if(f>a) w++; else if(f<a) l++; else d++;
  });
  const ratings = state.players.map(p=>Number(p.rating)).filter(r=>!isNaN(r) && r>0);
  const avgRating = ratings.length ? (ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(1) : "–";

  let html = `<div class="section-title">Statistiky</div>`;
  html += `<div class="stat-grid">
    <div class="stat-box"><div class="stat-value">${state.players.length}</div><div class="stat-label">Hráčů v kádru</div></div>
    <div class="stat-box"><div class="stat-value">${avgRating}</div><div class="stat-label">Průměrné hodnocení</div></div>
    <div class="stat-box"><div class="stat-value">${played.length}</div><div class="stat-label">Odehraných zápasů</div></div>
    <div class="stat-box"><div class="stat-value">${state.trainings.length}</div><div class="stat-label">Naplánovaných tréninků</div></div>
  </div>`;

  if(played.length>0){
    html += `<div class="card">
      <div class="row-between"><span class="small muted">Bilance V-R-P</span><span style="font-weight:700;">${w} - ${d} - ${l}</span></div>
      <div class="row-between" style="margin-top:8px;"><span class="small muted">Skóre</span><span style="font-weight:700;">${gf}:${ga}</span></div>
    </div>`;
  } else {
    html += `<div class="empty">Jakmile doplníš výsledky zápasů, objeví se tu bilance a skóre.</div>`;
  }

  if(state.players.length){
    const top = [...state.players].filter(p=>p.rating).sort((a,b)=>b.rating-a.rating).slice(0,3);
    if(top.length){
      html += `<div style="font-weight:800; font-size:16px; margin:22px 0 12px;">Nejlépe hodnocení hráči</div>`;
      html += top.map(p=>`
        <div class="card row-between">
          <div class="player-name">${esc(p.name)}</div>
          <div class="rating-pill">${p.rating}/10</div>
        </div>`).join("");
    }
  }
  main.innerHTML = html;
}

// ---------- utils ----------
function esc(s){ return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function formatDate(d){
  if(!d) return "";
  const dt = new Date(d+"T00:00:00");
  return dt.toLocaleDateString("cs-CZ", {day:"numeric", month:"numeric", year:"numeric"});
}
